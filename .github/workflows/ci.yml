name: CI/CD Backend

on:
  push:
    branches: [dev]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Message Service
        uses: docker/build-push-action@v5
        with:
          context: ./message-service
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/message-service:dev

      - name: Build WebSocket Gateway
        uses: docker/build-push-action@v5
        with:
          context: ./ws-gateway
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/ws-gateway:dev

      - name: Build Presence Service
        uses: docker/build-push-action@v5
        with:
          context: ./presence-service
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/presence-service:dev
